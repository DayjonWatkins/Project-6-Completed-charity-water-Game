<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <header class="game-header">
            <img src="img/cw_logo-horizontal.png" alt="charity: water" class="brand-logo">
            <h1 class="game-title">Water Drop</h1>
            <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        </header>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <button id="start-btn" type="button">Start Game</button>
        </div>

        <div id="game-container">
            <div id="game-result" class="game-result" role="status" aria-live="polite" hidden>
                <p id="result-message"></p>
                <p id="result-score"></p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
